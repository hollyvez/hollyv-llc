name: E2E smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Also triggerable manually with a custom URL (e.g. after a Netlify deploy)
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to test against (default: https://lesmorts.org)"
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Use the manually-supplied URL if provided; otherwise test against production
      BASE_URL: ${{ github.event.inputs.base_url || 'https://lesmorts.org' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: ${{ env.BASE_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
